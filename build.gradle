import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'com.gradleup.shadow' version '9.0.0-beta17'
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'dev.architectury.loom-no-remap' version '1.14-SNAPSHOT' apply false
    id 'gg.essential.multi-version.root' apply false
    id 'org.ajoberstar.grgit' version '5.3.2'
    id 'maven-publish'
    id 'java'
}

group 'net.william278'
version "$ext.plugin_version${versionMetadata()}"
description "$ext.plugin_description"
defaultTasks 'licenseFormat', 'build'

ext {
    set 'version', version.toString()
    set 'description', description.toString()
}

publishing {
    repositories {
        if (System.getenv("RELEASES_MAVEN_USERNAME") != null) {
            maven {
                name = "william278-releases"
                url = "https://repo.william278.net/releases"
                credentials {
                    username = System.getenv("RELEASES_MAVEN_USERNAME")
                    password = System.getenv("RELEASES_MAVEN_PASSWORD")
                }
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
        if (System.getenv("SNAPSHOTS_MAVEN_USERNAME") != null) {
            maven {
                name = "william278-snapshots"
                url = "https://repo.william278.net/snapshots"
                credentials {
                    username = System.getenv("SNAPSHOTS_MAVEN_USERNAME")
                    password = System.getenv("SNAPSHOTS_MAVEN_PASSWORD")
                }
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
    }
}

allprojects {
    if (project.name == 'fabric') {
        return
    }

    apply plugin: 'com.gradleup.shadow'
    apply plugin: 'java'

    compileJava.options.encoding = 'UTF-8'
    compileJava.options.release.set 17
    javadoc.options.encoding = 'UTF-8'
    javadoc.options.addStringOption('Xdoclint:none', '-quiet')

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        // Fabric maven is above paper maven to get FabricAPI from it over PaperMC
        maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.38'
        annotationProcessor 'org.projectlombok:lombok:1.18.38'

        testCompileOnly 'org.projectlombok:lombok:1.18.38'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

        testImplementation(platform("org.junit:junit-bom:6.0.0"))
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testCompileOnly 'org.jetbrains:annotations:26.0.2'
    }

    test {
        useJUnitPlatform()
    }

    def licenseHeader = '/*\n' + rootProject.file('HEADER').readLines().collect {
        " *${it ? " $it" : ''}"
    }.join('\n') + '\n */'
    def javaSources = { fileTree(projectDir) { include 'src/**/*.java' } }

    tasks.register('licenseCheck') {
        doLast {
            def missing = javaSources().findAll { !it.text.startsWith(licenseHeader) }
            if (!missing.isEmpty()) {
                throw new GradleException("Missing license header: ${missing*.path.join(', ')}")
            }
        }
    }

    tasks.register('licenseFormat') {
        doLast {
            javaSources().findAll { !it.text.startsWith(licenseHeader) }.each {
                it.text = "${licenseHeader}\n\n${it.text}"
            }
        }
    }

    processResources {
        filesMatching(['**/*.json', '**/*.yml']) {
            filter ReplaceTokens as Class, beginToken: '${', endToken: '}',
                    tokens: rootProject.ext.properties
        }
    }

    jar {
        manifest {
            attributes 'Implementation-Version': version
        }
    }
}

subprojects {
    // Ignore root fabric project (no jars)
    if (project.name == 'fabric') {
        return
    }

    version rootProject.version
//    archivesBaseName = "${rootProject.name}-${project.name.capitalize()}"
    def name = "$rootProject.name"
    if (rootProject != project.parent) {
        name += "-${project.parent.name.capitalize()}"
    } else {
        name += "-${project.name.capitalize()}"
    }
    base {
        archivesName = name
    }

    if (project.parent?.name?.equals('fabric')) {
        def fabricMajorVersion = project.name.split('\\.')[0] as int
        apply plugin: fabricMajorVersion >= 26 ? 'dev.architectury.loom-no-remap' : 'dev.architectury.loom'
        compileJava.options.release.set(project.name == '1.20.1' ? 17 : fabricMajorVersion >= 26 ? 25 : 21)
        if (fabricMajorVersion >= 26) {
            java.toolchain.languageVersion.set(JavaLanguageVersion.of(25))
        }
        version += "+mc.${project.name}"
    }

    jar {
        from '../LICENSE'
    }

    shadowJar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        destinationDirectory.set(file("$rootDir/target"))
        archiveClassifier.set('')
    }

    if (['common'].contains(project.name)) {
        java {
            withSourcesJar()
            withJavadocJar()
        }

        sourcesJar {
            destinationDirectory.set(file("$rootDir/target"))
        }
        javadocJar {
            destinationDirectory.set(file("$rootDir/target"))
        }
        jar.dependsOn(sourcesJar, javadocJar)

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    groupId = 'net.william278'
                    artifactId = 'papiproxybridge'
                    version = "$rootProject.version"
                    artifact jar
                    artifact javadocJar
                    artifact sourcesJar
                }
            }
        }
    }

    if (['bukkit', 'bungee', 'velocity'].contains(project.name) || project.parent?.name?.equals('fabric')) {
        shadowJar {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            destinationDirectory.set(file("$rootDir/target"))
            archiveClassifier.set('')
        }
    }

    jar.dependsOn(shadowJar)
    clean.delete "$rootDir/target"
}

logger.lifecycle("Building PAPIProxyBridge ${version} by William278")

@SuppressWarnings('GrMethodMayBeStatic')
def versionMetadata() {
    // Get if there is a tag for this commit
    def tag = grgit.tag.list().find { it.commit.id == grgit.head().id }
    if (tag != null) {
        return ''
    }

    // Otherwise, get the last commit hash and if it's a clean head
    if (grgit == null) {
        return '-' + System.getenv("GITHUB_RUN_NUMBER") ? 'build.' + System.getenv("GITHUB_RUN_NUMBER") : 'unknown'
    }
    return '-' + grgit.head().abbreviatedId + (grgit.status().clean ? '' : '-indev')
}