# Carry out tests on pull requests
name: PR Tests

on:
  pull_request:
    branches: [ 'master' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Python for publication checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Fabric publication coverage
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_fabric_publication.py
      - name: Test Pull Request
        run: ./gradlew build test
      - name: Verify all Fabric artifacts
        run: python3 scripts/check_fabric_publication.py --artifacts