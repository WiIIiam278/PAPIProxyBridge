# Builds, tests and publishes to maven when a release is published
name: Release Tests

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Python for publication checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Fabric publication coverage
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_fabric_publication.py
      - name: Build with Gradle
        run: ./gradlew build test publish
        env:
          RELEASES_MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          RELEASES_MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      - name: Verify all Fabric artifacts
        run: python3 scripts/check_fabric_publication.py --artifacts
      - name: 'Publish to William278.net 🚀'
        uses: WiIIiam278/bones-publish-action@v1
        with:
          api-key: ${{ secrets.BONES_API_KEY }}
          project: 'papiproxybridge'
          channel: 'release'
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          distro-names: |
            spigot
            fabric-1.20.1
            fabric-1.21.1
            fabric-1.21.4
            fabric-1.21.5
            fabric-1.21.8
            fabric-1.21.10
            fabric-1.21.11
            fabric-26.1.2
            fabric-26.2
            fabric-26.3
            velocity
            bungeecord
          distro-groups: |
            spigot
            fabric
            fabric
            fabric
            fabric
            fabric
            fabric
            fabric
            fabric
            fabric
            fabric
            velocity
            bungeecord
          distro-descriptions: |
            Spigot
            Fabric 1.20.1
            Fabric 1.21.1
            Fabric 1.21.4
            Fabric 1.21.5
            Fabric 1.21.8
            Fabric 1.21.10
            Fabric 1.21.11
            Fabric 26.1.2
            Fabric 26.2
            Fabric 26.3
            Velocity
            BungeeCord
          files: |
            target/PAPIProxyBridge-Bukkit-${{ github.event.release.tag_name }}.jar
            target/PAPIProxyBridge-Fabric-${{ github.event.release.tag_name }}+mc.1.20.1.jar
            target/PAPIProxyBridge-Fabric-${{ github.event.release.tag_name }}+mc.1.21.1.jar
            target/PAPIProxyBridge-Fabric-${{ github.event.release.tag_name }}+mc.1.21.4.jar
            target/PAPIProxyBridge-Fabric-${{ github.event.release.tag_name }}+mc.1.21.5.jar
            target/PAPIProxyBridge-Fabric-${{ github.event.release.tag_name }}+mc.1.21.8.jar
            target/PAPIProxyBridge-Fabric-${{ github.event.release.tag_name }}+mc.1.21.10.jar
            target/PAPIProxyBridge-Fabric-${{ github.event.release.tag_name }}+mc.1.21.11.jar
            target/PAPIProxyBridge-Fabric-${{ github.event.release.tag_name }}+mc.26.1.2.jar
            target/PAPIProxyBridge-Fabric-${{ github.event.release.tag_name }}+mc.26.2.jar
            target/PAPIProxyBridge-Fabric-${{ github.event.release.tag_name }}+mc.26.3.jar
            target/PAPIProxyBridge-Velocity-${{ github.event.release.tag_name }}.jar
            target/PAPIProxyBridge-Bungee-${{ github.event.release.tag_name }}.jar
      - name: 'Spigot: Publish to Modrinth'
        uses: WiIIiam278/mc-publish@hangar
        if: success() || failure()
        with:
          modrinth-id: bEIUEGTX
          modrinth-featured: false
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-dependencies: |
            placeholderapi | suggests | *
          files-primary: target/PAPIProxyBridge-Bukkit-${{ github.event.release.tag_name }}.jar
          name: PAPIProxyBridge (Spigot) v${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: release
          changelog: ${{ github.event.release.body }}
          loaders: |
            spigot
            paper
            folia
          game-versions: |
            1.17.1
            1.18
            1.18.1
            1.18.2
            1.19
